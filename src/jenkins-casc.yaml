jenkins:
  # Disable controller executors so everything runs on agents
  numExecutors: 0
  agentProtocols:
    - "JNLP4-connect"
  # Enable TCP agent listener on port 50000
  slaveAgentPort: 50000
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousJobStatusPermission: false

  # Dynamically provision agents via Docker Cloud
  clouds:
    - docker:
        name: "docker"
        dockerHost:
          # Routes requests through secure proxy container instead of a missing local socket
          uri: "tcp://docker-proxy:2375"
        containerCap: 3
        templates:
          - name: "inbound-agent"
            label: "docker-agent"
            mode: NORMAL
            remoteFs: "/home/jenkins/agent"
            instanceCapStr: "3"
            pullStrategy: PULL_LATEST
            pullTimeout: 180
            retentionStrategy:
              idleMinutes: 10
            connector:
              jnlp:
                # Uses standard internal container networking variable name
                user: "jenkins"
            dockerTemplateBase:
              image: "jenkins/inbound-agent:latest"
              network: "jenkins-net"

jobs:
  - script: "pipelineJob('test') { definition { cps { sandbox(true); script(new File('/var/jenkins_home/Jenkinsfile').text) } } }"
