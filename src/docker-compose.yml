name: jenkins-local-mesh
services:
  # 1. INIT SERVICE: Installs plugins cleanly into the volume first, then turns off
  jenkins-plugin-installer:
    image: jenkins/jenkins:lts
    container_name: jenkins-installer
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./plugins.txt:/usr/share/jenkins/ref/plugins.txt:ro
    networks:
      - jenkins-net
    command: >
      bash -c "jenkins-plugin-cli --plugin-file /usr/share/jenkins/ref/plugins.txt --plugin-download-directory /var/jenkins_home/plugins"

    # 2. CONTROLLER SERVICE: Runs the stable server once plugins exist
  jenkins-controller:
    image: jenkins/jenkins:lts
    container_name: jenkins-controller
    ports:
      - "8080:8080" # Jenkins Port
    volumes:
      - jenkins_data:/var/jenkins_home
      - ./jenkins-casc.yaml:/var/jenkins_home/casc.yaml:ro
      - ./init.groovy.d:/var/jenkins_home/init.groovy.d:ro
      - ./Jenkinsfile:/var/jenkins_home/Jenkinsfile:ro
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc.yaml
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.model.UsageStatistics.disabled=true
      - JENKINS_SLAVE_AGENT_PORT=50000
      - JENKINS_URL=http://localhost:8080/
    networks:
      - jenkins-net
      - docker-proxy-net
    depends_on:
      jenkins-plugin-installer:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy-net
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - VOLUMES=1
      - NETWORKS=1
      - INFO=1
      - SYSTEM=1
      - VERSION=1
      - PING=1
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:2375/version')\""]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  jenkins_data:
networks:
  jenkins-net:
    driver: bridge
  docker-proxy-net:
    driver: bridge
